<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 313" width="1200" height="313" role="img" aria-label="Hadi Abdulrahman - Security Researcher and Software Engineer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      @keyframes fadein {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="313" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="312" rx="12" fill="none" stroke="#30363d"/>

  <rect x="1" y="1" width="1198" height="44" rx="12" fill="#161b22"/>
  <rect x="1" y="30" width="1198" height="15" fill="#161b22"/>
  <circle cx="30" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="23" r="6" fill="#febc2e"/>
  <circle cx="74" cy="23" r="6" fill="#28c840"/>
  <text x="600" y="28" text-anchor="middle" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">hadi@github: ~/profile</text>
  <rect x="1" y="44" width="1198" height="2" fill="url(#accent)" opacity="0.9"/>

  <text x="44" y="92" xml:space="preserve" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="16" style="animation: fadein 0.35s ease 0.40s both"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
  <text x="44" y="119" xml:space="preserve" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="16" style="animation: fadein 0.35s ease 0.68s both"><tspan fill="#e6edf3">Hadi Abdulrahman — Security Researcher &amp; Software Engineer</tspan></text>
  <text x="44" y="160" xml:space="preserve" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="16" style="animation: fadein 0.35s ease 0.96s both"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">cat focus.txt</tspan></text>
  <text x="44" y="187" xml:space="preserve" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="16" style="animation: fadein 0.35s ease 1.24s both"><tspan fill="#8b949e">offensive security · detection engineering · applied ML · systems</tspan></text>
  <text x="44" y="228" xml:space="preserve" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="16" style="animation: fadein 0.35s ease 1.52s both"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">cat status.txt</tspan></text>
  <text x="44" y="255" xml:space="preserve" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="16" style="animation: fadein 0.35s ease 1.80s both"><tspan fill="#3fb950">open to new opportunities</tspan></text>
  <rect x="288" y="242" width="9" height="17" fill="#3fb950" style="animation: blink 1.1s steps(1) 2.6s infinite"/>

  <rect x="44" y="271" width="1112" height="1" fill="#30363d"/>
  <text x="44" y="293" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">github.com/mandoof1</text>
  <text x="1156" y="293" text-anchor="end" font-family="'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">building things that hold up</text>
</svg>
