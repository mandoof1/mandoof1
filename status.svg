<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 250" width="846" height="250">
  <defs>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes led {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.12; }
      }
      @keyframes rec {
        0%, 55%  { opacity: 1; }
        56%, 100% { opacity: 0.1; }
      }
      @keyframes blip {
        0%, 100% { opacity: 0; }
        8%       { opacity: 1; }
        30%      { opacity: 1; }
        42%      { opacity: 0; }
      }
      @keyframes ping {
        0%   { opacity: 0.8; transform: scale(0.6); }
        30%  { opacity: 0; transform: scale(1.6); }
        100% { opacity: 0; transform: scale(1.6); }
      }
    </style>
  </defs>
  <rect width="846" height="250" rx="10" fill="#0d1117"/><rect x="1" y="1" width="844" height="248" rx="9" fill="none" stroke="#00ff41" stroke-opacity="0.28"/>
  <text x="24" y="32" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="15" fill="#e6edf3">$ ./status --monitor</text>
  <text x="822" y="32" text-anchor="end" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#ff0055"
        style="animation: rec 1.4s steps(1) infinite">● REC</text>
  <rect x="24" y="44" width="798" height="1" fill="#00ff41" opacity="0.35"/>

  <!-- radar -->
  <g>
    <circle cx="130" cy="130" r="85" fill="none" stroke="#00ff41" stroke-opacity="0.3"/>
    <circle cx="130" cy="130" r="57" fill="none" stroke="#00ff41" stroke-opacity="0.2"/>
    <circle cx="130" cy="130" r="28" fill="none" stroke="#00ff41" stroke-opacity="0.15"/>
    <line x1="45" y1="130" x2="215" y2="130" stroke="#00ff41" stroke-opacity="0.15"/>
    <line x1="130" y1="45" x2="130" y2="215" stroke="#00ff41" stroke-opacity="0.15"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130"
                        dur="3.2s" repeatCount="indefinite"/>
      <path d="M130,130 L130,45 A85,85 0 0 1 203.6,87.5 Z" fill="url(#sweep)"/>
      <line x1="130" y1="130" x2="130" y2="45" stroke="#00ff41" stroke-opacity="0.95"/>
    </g>
    <circle cx="90" cy="100" r="3.5" fill="#ff0055" style="animation: blip 6s linear 0s infinite"/>
    <circle cx="90" cy="100" r="7" fill="none" stroke="#ff0055" stroke-opacity="0.6" style="animation: ping 6s linear 0s infinite; transform-box: fill-box; transform-origin: center"/>
    <circle cx="182" cy="168" r="3.5" fill="#ff0055" style="animation: blip 6s linear 1.4s infinite"/>
    <circle cx="182" cy="168" r="7" fill="none" stroke="#ff0055" stroke-opacity="0.6" style="animation: ping 6s linear 1.4s infinite; transform-box: fill-box; transform-origin: center"/>
    <circle cx="150" cy="78" r="3.5" fill="#ff0055" style="animation: blip 6s linear 2.6s infinite"/>
    <circle cx="150" cy="78" r="7" fill="none" stroke="#ff0055" stroke-opacity="0.6" style="animation: ping 6s linear 2.6s infinite; transform-box: fill-box; transform-origin: center"/>
    <circle cx="105" cy="172" r="3.5" fill="#ff0055" style="animation: blip 6s linear 3.8s infinite"/>
    <circle cx="105" cy="172" r="7" fill="none" stroke="#ff0055" stroke-opacity="0.6" style="animation: ping 6s linear 3.8s infinite; transform-box: fill-box; transform-origin: center"/>
    <text x="130" y="243" text-anchor="middle" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#8b949e">scanning: 4 contacts</text>
  </g>

  <!-- services -->
  <circle cx="262" cy="54" r="4" fill="#00ff41" style="animation: led 1.1s ease-in-out infinite"/>
    <text x="278" y="58" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#e6edf3">wisp</text>
    <text x="810" y="58" text-anchor="end" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#00ff41">[ONLINE]</text>
    <circle cx="262" cy="80" r="4" fill="#00ff41" style="animation: led 1.7s ease-in-out infinite"/>
    <text x="278" y="84" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#e6edf3">amnis</text>
    <text x="810" y="84" text-anchor="end" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#00ff41">[ONLINE]</text>
    <circle cx="262" cy="106" r="4" fill="#00ff41" style="animation: led 0.9s ease-in-out infinite"/>
    <text x="278" y="110" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#e6edf3">honeypots</text>
    <text x="810" y="110" text-anchor="end" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#00ff41">[ARMED]</text>
    <circle cx="262" cy="132" r="4" fill="#febc2e" style="animation: led 2.3s ease-in-out infinite"/>
    <text x="278" y="136" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#e6edf3">browseye</text>
    <text x="810" y="136" text-anchor="end" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#febc2e">[STANDBY]</text>
    <circle cx="262" cy="158" r="4" fill="#00d4ff" style="animation: led 1.4s ease-in-out infinite"/>
    <text x="278" y="162" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#e6edf3">media pipeline</text>
    <text x="810" y="162" text-anchor="end" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#00d4ff">[STREAMING]</text>
    <circle cx="262" cy="184" r="4" fill="#00ff41" style="animation: led 2.1s ease-in-out infinite"/>
    <text x="278" y="188" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#e6edf3">uplink</text>
    <text x="810" y="188" text-anchor="end" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#00ff41">[X25519]</text>
    <circle cx="262" cy="210" r="4" fill="#ff00aa" style="animation: led 3.1s ease-in-out infinite"/>
    <text x="278" y="214" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#e6edf3">novelist</text>
    <text x="810" y="214" text-anchor="end" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#ff00aa">[WRITING]</text>
  <rect x="24" y="228" width="798" height="1" fill="#00ff41" opacity="0.2"/>
  <text x="24" y="242" font-family="Consolas, 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#3d4f46">signal integrity 99.9% · no third-party trackers · stay paranoid</text>
</svg>
