name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: mandoof1
          outputs: |
            dist/snake.svg?color_snake=#c5f277&color_dots=#101a24,#204342,#35756b,#78dce8,#c5f277&color_background=#0b1118
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          user_name: "Hadi Abdulrahman"
          user_email: "haadii2005@gmail.com"
